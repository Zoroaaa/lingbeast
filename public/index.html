<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9dfc5">
<meta name="color-scheme" content="light">
<title>灵兽录 · 山海新契</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="灵兽录">
<link rel="stylesheet" href="style.css?v=79">
</head>
<body>
<div id="app">

  <section id="view-title" class="view view-title">
    <div class="title-scene" aria-hidden="true">
      <div class="ts-sky"></div>
      <div class="ts-sun"></div>
      <div class="ts-cloud c1"></div>
      <div class="ts-cloud c2"></div>
      <div class="ts-cloud c3"></div>
      <div class="ts-mountain back"></div>
      <div class="ts-mountain mid"></div>
      <div class="ts-mountain front"></div>
      <div class="ts-ground"></div>
      <div class="ts-torii"><i></i><i></i><i></i></div>
      <div class="ts-hero"></div>
      <div class="title-beast" id="title-beast"></div>
      <div class="ts-fireflies"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="title-col">
      <p class="eyebrow">山海新契 · 九嶂卷</p>
      <h1 class="title">灵兽录</h1>
      <p class="subtitle">山有灵，契而生。</p>
      <div class="title-actions">
        <button class="btn btn-ink" id="btn-start">入山</button>
        <button class="btn btn-ghost" id="btn-continue" hidden>续前缘</button>
      </div>
      <p class="title-progress" id="title-progress" hidden></p>
    </div>
    <button class="account-chip" id="account-chip"><span class="dot" id="account-dot"></span><span id="account-label">未登录 · 云端未连接</span></button>
    <p class="title-foot">回合制 · 灵兽收集 · 像素山海　·　点击行走 / 空格交谈</p>
  </section>

  <section id="view-world" class="view view-world" hidden>
    <header class="world-hud">
      <div class="hud-left">
        <div class="scene-chip">
          <span class="scene-chapter" id="scene-chapter"></span>
          <span class="scene-name" id="scene-name"></span>
          <span class="time-chip" id="time-weather"></span>
        </div>
        <div class="quest-chip">
          <span class="quest-label">主线</span>
          <b id="quest-title"></b>
          <span class="quest-step" id="quest-step"></span>
        </div>
        <div class="jade-chip" title="灵玉"><span class="jade-glyph">玉</span><b id="jade-count">0</b></div>
      </div>
      <button type="button" class="hud-menu-btn" id="btn-menu" aria-expanded="false" aria-controls="hud-nav">菜单</button>
      <nav class="hud-right" id="hud-nav" aria-label="功能">
        <div class="hud-group">
          <button type="button" class="link-btn" id="btn-map" aria-keyshortcuts="M">山河图<em>M</em></button>
          <button type="button" class="link-btn" id="btn-codex" aria-keyshortcuts="B">灵兽录<em>B</em></button>
        </div>
        <div class="hud-group">
          <button type="button" class="link-btn" id="btn-bag" aria-keyshortcuts="I">行囊<em>I</em></button>
          <button type="button" class="link-btn" id="btn-quests" aria-keyshortcuts="J">任务<em>J</em></button>
          <button type="button" class="link-btn" id="btn-team" aria-keyshortcuts="T">队伍<em>T</em></button>
        </div>
        <div class="hud-group hud-group-system">
          <button type="button" class="link-btn" id="btn-save" aria-keyshortcuts="Q">存档<em>Q</em></button>
          <button type="button" class="link-btn" id="btn-settings">设置</button>
          <button type="button" class="link-btn" id="btn-exit">出山</button>
        </div>
      </nav>
    </header>

    <div class="stage-wrap">
      <div id="game-canvas" role="region" aria-label="场景地图。使用 WASD 或方向键行走，E 或空格交互。"></div>
      <div class="minimap-wrap" id="minimap-wrap">
        <canvas id="minimap" width="180" height="120" aria-label="小地图"></canvas>
        <span class="minimap-label" id="minimap-label"></span>
      </div>
      <div class="region-title" id="region-title" role="status" aria-live="polite" hidden>
        <span class="region-title-chapter" id="region-title-chapter"></span>
        <span class="region-title-name" id="region-title-name"></span>
        <span class="region-title-sub" id="region-title-sub"></span>
      </div>
      <div class="stage-loading" id="world-loading" role="status" aria-live="polite" hidden>
        <span class="stage-loading-box" aria-hidden="true"></span>
        <span>山门开启中……</span>
      </div>
    </div>

    <div class="world-foot">
      <div class="party-mini" id="party-mini"></div>
      <p class="hint-bar"><span class="hint-desktop">点击地面自动寻路 · 点击人物 / 灵物交互 · WASD 行走 · M 山河图</span><span class="hint-touch">左侧摇杆行走 · 右侧契键交互 · 菜单里可开山河图</span></p>
      <button type="button" class="talk-btn" id="btn-talk">交谈</button>
    </div>

    <div class="touch-layer" id="touch-layer">
      <div class="joystick" id="joystick" role="group" aria-label="移动摇杆"><span class="joystick-knob" id="joystick-knob"></span></div>
      <button type="button" class="touch-action" id="btn-interact" aria-label="交互">契</button>
    </div>

    <aside class="tutorial-card" id="tutorial-card" aria-label="新手引导" hidden>
      <div class="tc-head">
        <span class="tc-eyebrow" id="tc-eyebrow">一 · 入谷</span>
        <button type="button" class="tc-skip" id="tc-skip">跳过引导</button>
      </div>
      <b class="tc-title" id="tc-title">走到青溪谷</b>
      <p class="tc-hint" id="tc-hint"></p>
      <div class="tc-foot">
        <span class="tc-bar"><i id="tc-fill"></i></span>
        <span class="tc-count" id="tc-count">1 / 6</span>
      </div>
    </aside>

    <div class="dialog" id="dialog" role="dialog" aria-labelledby="dialog-name" aria-describedby="dialog-text" tabindex="-1" hidden>
      <div class="dialog-seal" id="dialog-seal"></div>
      <div class="dialog-main">
        <p class="dialog-name" id="dialog-name"></p>
        <p class="dialog-text" id="dialog-text"></p>
        <div class="dialog-choices" id="dialog-choices" hidden></div>
      </div>
      <button type="button" class="dialog-next" id="dialog-next">继续</button>
    </div>
  </section>

  <section id="view-battle" class="view view-battle" hidden>
    <div id="battle-scene" class="battle-scene" tabindex="-1">
      <div class="battle-bg" id="battle-bg" aria-hidden="true"></div>

      <header class="battle-head">
        <div class="battle-tools" id="battle-tools">
          <button type="button" class="bt-auto" id="bt-auto" aria-pressed="false" aria-label="自动战斗">自动 · 关</button>
          <div class="bt-speed" role="group" aria-label="战斗速度">
            <button type="button" class="bt-speed-btn active" data-battle-speed="1" aria-pressed="true">1x</button>
            <button type="button" class="bt-speed-btn" data-battle-speed="2" aria-pressed="false">2x</button>
            <button type="button" class="bt-speed-btn" data-battle-speed="skip" aria-pressed="false">跳过演出</button>
          </div>
        </div>
        <div class="foe-info">
          <div class="foe-head">
            <span class="foe-name" id="foe-name"></span>
            <span class="foe-meta" id="foe-meta"></span>
          </div>
          <div class="hp hp-foe" role="progressbar" aria-label="敌方气血" aria-valuemin="0" aria-valuemax="1" aria-valuenow="1"><i id="foe-hp"></i></div>
          <div class="hp-num" id="foe-hpnum"></div>
          <div class="status-row" id="foe-status"></div>
        </div>
        <div class="turn-order" id="turn-order" aria-label="行动顺序"></div>
      </header>

      <div class="boss-banner" id="boss-banner" role="status" aria-live="polite" hidden>
        <span class="boss-banner-eyebrow" id="boss-banner-eyebrow">渊兽异动</span>
        <b id="boss-banner-text"></b>
      </div>

      <div class="arena">
        <div class="art-slot foe-slot" id="foe-art"></div>
        <div class="art-slot self-slot" id="self-art"></div>
      </div>

      <div class="battle-log" id="battle-log" role="log" aria-live="polite" aria-label="战斗记录"></div>
      <div class="party-strip" id="party-strip"></div>

      <div class="battle-bottom">
        <div class="self-line">
          <div class="self-head">
            <span class="self-name" id="self-name"></span>
            <span class="self-meta" id="self-meta"></span>
          </div>
          <div class="hp hp-self" role="progressbar" aria-label="我方气血" aria-valuemin="0" aria-valuemax="1" aria-valuenow="1"><i id="self-hp"></i></div>
          <div class="hp hp-exp" role="progressbar" aria-label="经验" aria-valuemin="0" aria-valuemax="1" aria-valuenow="1"><i id="self-exp"></i></div>
          <div class="status-row" id="self-status"></div>
          <div class="combo-meter" id="combo-meter" hidden>
            <span class="combo-label">灵连</span>
            <span class="combo-chain" id="combo-chain">灵连 ×0</span>
            <span class="combo-pips" id="combo-pips"><i></i><i></i><i></i></span>
          </div>
          <div class="bond" id="bond" title="契势槽"><span class="bond-label" id="bond-label">契势</span><span class="bond-track" id="bond-track" role="progressbar" aria-label="契势" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="bond-fill"></i></span></div>
        </div>
        <div class="commands" id="commands"></div>
      </div>

      <div class="float-layer" id="float-layer" aria-hidden="true"></div>
      <div class="battle-overlay" id="battle-overlay" role="dialog" aria-modal="true" hidden></div>
    </div>
  </section>

  <section id="view-end" class="view view-end" hidden>
    <div class="end-inner">
      <p class="eyebrow" id="end-eyebrow">终</p>
      <h2 id="end-title">山门重开</h2>
      <p class="end-text" id="end-text"></p>
      <ul class="end-stats" id="end-stats"></ul>
      <p class="end-extra" id="end-extra"></p>
      <div class="end-actions">
        <button class="btn btn-ink" id="btn-back-title">归山门</button>
        <button class="btn btn-ghost" id="btn-postgame">继续游历</button>
      </div>
    </div>
  </section>

  <div class="fade" id="fade" aria-hidden="true"></div>
  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true" hidden></div>
  <div class="sr-only" id="sr-live" aria-live="polite" aria-atomic="true"></div>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <div class="modal-sheet" tabindex="-1">
      <header class="modal-head">
        <h3 id="modal-title"></h3>
        <button type="button" class="close" id="modal-close" aria-label="关闭">×</button>
      </header>
      <div class="modal-body" id="modal-body"></div>
      <footer class="modal-foot" id="modal-foot"></footer>
    </div>
  </div>

</div>
